<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>GitHub 프로필 디자인 비교</title>
    <style>
      * { box-sizing:border-box; }
      body { margin:0; padding:32px; background:#111827; color:#fff; font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
      h1 { margin:0 0 24px; font-size:24px; }
      .grid { display:grid; grid-template-columns:1fr 1fr; gap:24px; align-items:start; }
      figure { margin:0; padding:14px; background:#fff; border-radius:8px; }
      figcaption { padding:0 0 12px; color:#0a2247; font-weight:700; }
      img { display:block; width:100%; height:auto; }
    </style>
  </head>
  <body>
    <h1>Selected direction vs. GitHub-ready implementation</h1>
    <div class="grid">
      <figure><figcaption>Source visual — selected option 3</figcaption><img src="/reference-option-3.png" alt="선택 시안" /></figure>
      <figure><figcaption>Implementation — GitHub README preview</figcaption><img src="implementation-profile.png" alt="구현 미리보기" /></figure>
    </div>
  </body>
</html>
